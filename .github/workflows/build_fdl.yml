name: Build & Sign FDL All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Needed to publish GitHub Releases (softprops/action-gh-release)
permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────
  # 18 路并行编译：每个平台一个独立 runner (4-core x64)
  # 官方签名：make chipram/bootloader ->
  #           build_tool_and_sign_images() ->
  #           packimage.sh -> sprd_sign + imgheaderinsert
  # ──────────────────────────────────────────────────
  build:
    name: ${{ matrix.short }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false   # 一个失败不取消其余
      matrix:
        include:
          # s9863a 系列 (4)
          - { short: s9863a1c10,  product: s9863a1c10_Natv    }
          - { short: s9863a1h10,  product: s9863a1h10_Natv    }
          - { short: s9863a2h10,  product: s9863a2h10_Natv    }
          - { short: s9863a3c10,  product: s9863a3c10_Natv    }
          # ums512 系列 (3)
          - { short: ums512_1h10,  product: ums512_1h10_Natv   }
          - { short: ums512_20c10, product: ums512_20c10_native }
          - { short: ums512_2h10,  product: ums512_2h10_Natv   }
          # sl8541e (1)
          - { short: sl8541e_1h10, product: sl8541e_1h10_Natv  }
          # ud710 系列 (8) — SECURE_BOOT=SPRD
          - { short: ud710_10h10,  product: ud710_10h10_native  }
          - { short: ud710_20c11,  product: ud710_20c11_native  }
          - { short: ud710_2c11,   product: ud710_2c11_native   }
          - { short: ud710_2h10,   product: ud710_2h10_native   }
          - { short: ud710_2h10u,  product: ud710_2h10u_native  }
          - { short: ud710_3h10u,  product: ud710_3h10u_native  }
          - { short: ud710_7h10,   product: ud710_7h10_native   }
          - { short: ud710_9h10u,  product: ud710_9h10u_native  }
          # ums7520 系列 (2) — SECURE_BOOT=NONE (no signing)
          - { short: ums7520_haps, product: ums7520_haps_native }
          - { short: ums7520_zebu,  product: ums7520_zebu_native  }

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        timeout-minutes: 15
        run: |
          # 18 parallel matrix jobs hammer apt on the runner image; some
          # runners stall with NO output for minutes (dpkg lock / unpack IO).
          # Watchdog: poll the install log every 5s; if no new output for 30s
          # straight, treat as stalled -> kill apt, clean locks, apt-get
          # update, and retry (up to 5 attempts).
          # NOTE: use -q (not -qq): -qq makes apt nearly silent, so the
          # watchdog would mis-fire on a healthy install. With -q apt prints
          # "Get:"/"Unpacking" lines continuously while it is progressing.
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS="-o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          PKGS="binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu device-tree-compiler python3 bc flex bison libssl-dev"

          apt_cleanup() {
            sudo pkill -9 -f "apt-get|aptd|unattended-upgrades" 2>/dev/null || true
            sleep 1
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock \
                       /var/cache/apt/archives/lock /var/lib/apt/lists/lock
            sudo dpkg --configure -a 2>/dev/null || true
          }

          apt_with_watchdog() {
            local attempt=$1 log=/tmp/apt_install.log
            local stall_limit=6   # 6 polls x 5s = 30s of no output => stalled
            : > "$log"
            (sudo apt-get install -y -q --fix-missing --no-install-recommends $APT_OPTS $PKGS > "$log" 2>&1) &
            local pid=$!
            local last=0 stall=0
            while kill -0 $pid 2>/dev/null; do
              sleep 5
              local cur=0; [ -f "$log" ] && cur=$(stat -c%s "$log")
              if [ "$cur" = "$last" ]; then
                stall=$((stall+1))
                if [ $stall -ge $stall_limit ]; then
                  echo "[watchdog] no apt output for $((stall*5))s (attempt $attempt); killing & cleaning"
                  ps aux | grep -E "apt-get|dpkg" | grep -v grep || true
                  kill $pid 2>/dev/null; wait $pid 2>/dev/null
                  apt_cleanup
                  return 1
                fi
              else
                stall=0
              fi
              last=$cur
            done
            wait $pid; return $?
          }

          sudo pkill -f "unattended-upgrades|aptd" 2>/dev/null || true

          if apt_with_watchdog 1; then
            echo "apt install OK (attempt 1)"
            exit 0
          fi

          for i in 2 3 4 5; do
            echo "apt attempt $i: updating index then retrying..."
            timeout 180 sudo apt-get update -q --fix-missing $APT_OPTS
            if apt_with_watchdog $i; then
              echo "apt install OK (attempt $i)"
              exit 0
            fi
          done
          echo "ERROR: apt install failed after 5 attempts"
          exit 1

      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Setup Zig AArch64 cross-compiler
        run: |
          bash .github/scripts/setup_zig_tc.sh /tmp/zig-tc
          export PATH="/tmp/zig-tc:$PATH"
          echo "int main(){return 0;}" | aarch64-linux-gnu-gcc -x c - -o /tmp/test_aarch64
          file /tmp/test_aarch64

      - name: Fix executable permissions
        run: |
          find . -name '*.sh' -o -name 'mkconfig' | xargs chmod +x
          chmod +x build/packimage_scripts/sprd_sign build/packimage_scripts/imgheaderinsert
          # Replace bundled dtc (Windows binary) with system dtc
          ln -sf /usr/bin/dtc bootloader/u-boot15/tools/dtc/dtc

      - name: Apply source patches
        run: python3 patch_all.py

      - name: Build FDL1 (chipram)
        run: |
          export PATH="/tmp/zig-tc:$PATH"
          export CROSS_COMPILE_TOOLCHAIN="/tmp/zig-tc/"
          mkdir -p toolchain/prebuilts
          bash .github/scripts/build_one.sh "${{ matrix.short }}" "${{ matrix.product }}" fdl1

      - name: Build FDL2 (bootloader)
        run: |
          export PATH="/tmp/zig-tc:$PATH"
          export CROSS_COMPILE_TOOLCHAIN="/tmp/zig-tc/"
          bash .github/scripts/build_one.sh "${{ matrix.short }}" "${{ matrix.product }}" fdl2

      - name: Collect artifacts
        run: |
          export PATH="/tmp/zig-tc:$PATH"
          export CROSS_COMPILE_TOOLCHAIN="/tmp/zig-tc/"
          bash .github/scripts/build_one.sh "${{ matrix.short }}" "${{ matrix.product }}" collect

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fdl-${{ matrix.short }}
          path: fdl_output/
          retention-days: 30

      - name: Upload build logs (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.short }}
          path: build_*.log
          if-no-files-found: ignore
          retention-days: 30

  # ──────────────────────────────────────────────────
  # 汇总：收集 18 个 job 的产物，打包为单一 artifact
  # ──────────────────────────────────────────────────
  collect:
    name: Collect all artifacts
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fdl-*
          path: fdl_all
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: buildlog-*
          path: build_logs
          merge-multiple: true
          if-no-files-found: ignore

      - name: Summarize all build logs
        if: always()
        run: |
          mkdir -p err_summary
          : > err_summary/all_errors.txt
          for log in build_logs/*.log; do
            [ -f "$log" ] || continue
            echo "===== $log =====" >> err_summary/all_errors.txt
            # Include the FULL log so errors can be diagnosed with surrounding
            # context, not just grep'd one-liners.
            cat "$log" >> err_summary/all_errors.txt
            echo "" >> err_summary/all_errors.txt
          done
          echo "=================== ALL BUILD LOGS ==================="
          cat err_summary/all_errors.txt
          echo "========================================================="
          echo "Total lines: $(wc -l < err_summary/all_errors.txt)"

      - name: Show summary
        run: |
          echo "=== All FDL artifacts ==="
          echo ""
          printf "%-20s %10s %10s\n" "Platform" "FDL1" "FDL2"
          printf "%-20s %10s %10s\n" "--------" "----" "----"
          for f in fdl_all/*_fdl1.bin; do
            plat=$(basename "$f" _fdl1.bin)
            fdl1_sz=$(stat -c%s "$f" 2>/dev/null || echo "MISSING")
            fdl2="$fdl_all/${plat}_fdl2.bin"
            fdl2_sz=$(stat -c%s "$fdl2" 2>/dev/null || echo "MISSING")
            printf "%-20s %10s %10s\n" "$plat" "$fdl1_sz" "$fdl2_sz"
          done
          echo ""
          echo "Total: $(ls fdl_all/*.bin 2>/dev/null | wc -l) files"

      - name: Package per-platform zips
        run: |
          mkdir -p release_zips
          for f in fdl_all/*_fdl1.bin; do
            plat=$(basename "$f" _fdl1.bin)
            fdl2="fdl_all/${plat}_fdl2.bin"
            if [ -f "$f" ] && [ -f "$fdl2" ]; then
              tmpdir="tmp_${plat}"
              mkdir -p "$tmpdir"
              cp "$f" "$tmpdir/fdl1.bin"
              cp "$fdl2" "$tmpdir/fdl2.bin"
              (cd "$tmpdir" && zip -q "../release_zips/${plat}.zip" fdl1.bin fdl2.bin)
              rm -rf "$tmpdir"
              echo "  ${plat}.zip: $(stat -c%s "release_zips/${plat}.zip") bytes"
            else
              echo "  WARN: $plat incomplete (fdl1=$([ -f "$f" ] && echo yes || echo no), fdl2=$([ -f "$fdl2" ] && echo yes || echo no))"
            fi
          done
          echo ""
          echo "Total zips: $(ls release_zips/*.zip 2>/dev/null | wc -l)"

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdl-all-platforms-signed
          path: fdl_all/
          retention-days: 30

      - name: Upload error summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: error-summary
          path: err_summary/
          if-no-files-found: ignore
          retention-days: 30

      # ── 发布到 GitHub Releases（push 到 main/master，或手动触发） ──
      - name: Set release tag
        id: rel_tag
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        run: echo "tag=fdl-build-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_tag.outputs.tag }}
          name: FDL Build ${{ github.run_number }}
          body: |
            FDL binaries for all supported platforms.

            - **FDL1** (chipram): signed for SECURE_BOOT=SPRD platforms
            - **FDL2** (bootloader): signed for SECURE_BOOT=SPRD platforms
            - ums7520_haps / ums7520_zebu: unsigned (SECURE_BOOT=NONE)

            Each zip is named after its platform and contains `fdl1.bin` + `fdl2.bin`.

            Triggered by commit `${{ github.sha }}`.
          files: release_zips/*.zip
          generate_release_notes: false
